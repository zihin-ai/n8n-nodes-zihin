name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts  # isolated-vm (dev-only, via n8n-workflow) fails to compile on runners; not needed to build/test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Package contents
        run: npm run check:publication
      - name: No runtime dependencies (n8n verified-node rule)
        run: node -e 'const p=require("./package.json"); if (Object.keys(p.dependencies||{}).length) { console.error("runtime dependencies are not allowed"); process.exit(1) }'
